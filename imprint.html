<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050505">
<title>Imprint | THE 58</title>
<style>
:root{--bg:#050505;--text:#EAE6EF;--muted:#938C9B;--lav:#B59AF2}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:64px 24px;text-align:center}
.wrap{width:min(760px,100%)}
.label{color:var(--lav);font-size:10px;letter-spacing:.38em;margin-bottom:10px}
.logo{width:min(620px,100%);margin:0 auto 6px;line-height:0}
.logo svg{display:block;width:100%;height:auto;overflow:visible}
.logo text{font-family:Georgia,"Times New Roman",serif;font-size:178px;font-weight:400;letter-spacing:-8px;fill:var(--lav)}
.location{margin:0 0 48px;color:var(--muted);font-size:10px;letter-spacing:.42em}
p{margin:0 0 24px;color:var(--muted);line-height:1.8;font-size:16px}
strong{color:var(--lav);font-weight:400}
.close{display:inline-block;margin-top:40px;color:var(--lav);text-decoration:none;font-size:10px;letter-spacing:.28em;padding:14px 18px}
@media(max-width:600px){body{padding:44px 20px}.logo text{font-size:170px}.location{margin-bottom:42px}}
</style>
</head>
<body>
  <main class="wrap">
    <div class="label">IMPRINT</div>
    <h1 class="logo" aria-label="THE 58">
      <svg viewBox="0 0 760 190" role="img" aria-hidden="true">
        <text x="300" y="150" text-anchor="middle">THE</text>
        <text x="525" y="150" text-anchor="middle">5</text>
        <text x="625" y="181" text-anchor="middle">8</text>
      </svg>
    </h1>
    <div class="location">BODRUM</div>
    <p><strong>Cesur Altay</strong></p>
    <p>Private Members Club</p>
    <a class="close" href="./">CLOSE</a>
  </main>
</body>
</html>
