<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Imprint | THE 58</title>
<style>
:root{--bg:#050505;--text:#EAE6EF;--muted:#938C9B;--purple:#B59AF2}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
body{font-family:Arial,Helvetica,sans-serif}
.page{
 min-height:100svh;display:flex;align-items:center;justify-content:center;
 padding:46px 24px;background:#050505;
}
.content{width:min(520px,100%);text-align:center}
.imprint{font-size:11px;letter-spacing:.43em;color:var(--purple);margin-bottom:28px}
.logoWrap{position:relative;width:min(355px,78vw);margin:0 auto 36px}
.logo{
 width:100%;height:auto;display:block;
 animation:signatureMotion 10s cubic-bezier(.45,.05,.25,1) infinite;
 filter:drop-shadow(0 16px 28px rgba(181,154,242,.09));
 transform-origin:center;
}
.glint{
 position:absolute;z-index:6;top:8%;left:-18%;width:18%;height:78%;
 background:linear-gradient(100deg,transparent,rgba(255,244,219,.38),rgba(199,171,255,.32),transparent);
 filter:blur(7px);opacity:0;transform:skewX(-15deg);
 mix-blend-mode:screen;pointer-events:none;
 animation:signatureSweep 10s ease-in-out infinite;
}
.moon{
 position:absolute;z-index:0;right:11%;top:8%;width:34px;height:34px;border-radius:50%;
 border:1px solid rgba(231,216,255,.28);opacity:.18;
 box-shadow:0 0 28px rgba(181,154,242,.12);
 animation:moonGlow 8s ease-in-out infinite;
}
.sea{
 position:absolute;z-index:0;left:8%;right:8%;bottom:8%;height:1px;
 background:linear-gradient(90deg,transparent,rgba(181,154,242,.10),rgba(239,224,255,.35),rgba(181,154,242,.10),transparent);
 animation:seaLight 8s ease-in-out infinite;
}
.sunset{
 position:absolute;z-index:0;left:50%;bottom:1%;width:48%;height:34%;
 transform:translateX(-50%);
 background:radial-gradient(ellipse at center,rgba(196,155,104,.10),rgba(181,154,242,.055) 35%,transparent 70%);
 filter:blur(18px);animation:sunsetBreath 8s ease-in-out infinite;
}
.copy{
 max-width:425px;margin:0 auto;color:var(--muted);
 font:400 15px/1.8 Arial,Helvetica,sans-serif;
}
.copy strong{color:var(--purple);font-weight:400}
.rule{width:58px;height:1px;background:#342c3e;margin:27px auto}
.est{color:#6f6877;font-size:9px;letter-spacing:.32em}
.close{
 margin-top:34px;border:0;background:none;padding:8px;color:var(--purple);
 font-size:10px;letter-spacing:.4em;cursor:pointer
}
@keyframes signatureMotion{
 0%{
   opacity:0;
   transform:perspective(1000px) translateY(14px) scale(.965) rotateX(5deg);
   filter:blur(5px) drop-shadow(0 0 0 rgba(181,154,242,0));
 }
 10%{
   opacity:1;
   transform:perspective(1000px) translateY(0) scale(1) rotateX(0);
   filter:blur(0) drop-shadow(0 12px 25px rgba(181,154,242,.10));
 }
 28%{transform:perspective(1000px) translateY(-4px) rotateY(-1.2deg) scale(1.003)}
 48%{transform:perspective(1000px) translateY(-7px) rotateY(0deg) scale(1.006)}
 68%{transform:perspective(1000px) translateY(-4px) rotateY(1.2deg) scale(1.003)}
 88%,100%{
   opacity:1;
   transform:perspective(1000px) translateY(0) rotateY(0deg) scale(1);
   filter:drop-shadow(0 12px 25px rgba(181,154,242,.10));
 }
}
@keyframes signatureSweep{
 0%,24%{left:-20%;opacity:0}
 32%{opacity:.18}
 44%{opacity:.48}
 58%{left:102%;opacity:0}
 100%{left:102%;opacity:0}
}
@keyframes moonGlow{
 0%,100%{opacity:.08;transform:scale(.98)}
 50%{opacity:.19;transform:scale(1.02)}
}
@keyframes seaLight{
 0%,100%{opacity:.18;transform:scaleX(.9)}
 50%{opacity:.52;transform:scaleX(1)}
}
@keyframes sunsetBreath{
 0%,100%{opacity:.22;transform:translateX(-50%) scale(.96)}
 50%{opacity:.48;transform:translateX(-50%) scale(1.04)}
}
@media(max-width:600px){
 .page{padding:34px 20px}
 .logoWrap{width:78vw;max-width:355px;margin-bottom:31px}
 .copy{font-size:14px;line-height:1.75;padding:0 12px}
 @keyframes glint{
  0%,26%,100%{opacity:0;transform:translateX(0) scale(.6)}
  34%{opacity:.9}
  52%{opacity:.5;transform:translateX(72vw) scale(1)}
  58%{opacity:0;transform:translateX(76vw) scale(.5)}
 }
}
@media(prefers-reduced-motion:reduce){.logo,.glint{
 position:absolute;z-index:6;top:8%;left:-18%;width:18%;height:78%;
 background:linear-gradient(100deg,transparent,rgba(255,244,219,.38),rgba(199,171,255,.32),transparent);
 filter:blur(7px);opacity:0;transform:skewX(-15deg);
 mix-blend-mode:screen;pointer-events:none;
 animation:signatureSweep 10s ease-in-out infinite;
}
.moon{
 position:absolute;z-index:0;right:11%;top:8%;width:34px;height:34px;border-radius:50%;
 border:1px solid rgba(231,216,255,.28);opacity:.18;
 box-shadow:0 0 28px rgba(181,154,242,.12);
 animation:moonGlow 8s ease-in-out infinite;
}
.sea{
 position:absolute;z-index:0;left:8%;right:8%;bottom:8%;height:1px;
 background:linear-gradient(90deg,transparent,rgba(181,154,242,.10),rgba(239,224,255,.35),rgba(181,154,242,.10),transparent);
 animation:seaLight 8s ease-in-out infinite;
}
.sunset{
 position:absolute;z-index:0;left:50%;bottom:1%;width:48%;height:34%;
 transform:translateX(-50%);
 background:radial-gradient(ellipse at center,rgba(196,155,104,.10),rgba(181,154,242,.055) 35%,transparent 70%);
 filter:blur(18px);animation:sunsetBreath 8s ease-in-out infinite;
}}
</style>
</head>
